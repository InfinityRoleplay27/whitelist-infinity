<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whitelist - Infinity Roleplay</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4e54c8, #8f94fb);
    margin: 0;
    padding: 0;
    color: white;
  }
  header {
    text-align: center;
    padding: 30px;
  }
  header h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  main {
    max-width: 700px;
    background: rgba(0,0,0,0.4);
    margin: auto;
    padding: 30px;
    border-radius: 10px;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }
  input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: none;
    border-radius: 5px;
    outline: none;
  }
  input[type="submit"] {
    background: #4CAF50;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.3s;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
  }
  input[type="submit"]:hover {
    background: #45a049;
  }
  footer {
    text-align: center;
    padding: 15px;
    background: rgba(0,0,0,0.5);
    margin-top: 30px;
  }
</style>
</head>
<body>
<header>
  <h1>Infinity Roleplay - Whitelist</h1>
  <p>Completa este formulario para enviar tu solicitud</p>
</header>
<main>
  <form id="whitelistForm">
    <label for="discord">Nombre en Discord:</label>
    <input type="text" id="discord" name="discord" placeholder="Ej: TuNombre#0000" required />
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" required />
    <label for="experiencia">¿Tienes experiencia en Roleplay?</label>
    <textarea id="experiencia" name="experiencia" rows="3" required></textarea>
    <label for="rol">Explica qué es el Roleplay:</label>
    <textarea id="rol" name="rol" rows="3" required></textarea>
    <label for="normas">¿Aceptas las normas del servidor?</label>
    <select id="normas" name="normas" required>
      <option value="">Selecciona...</option>
      <option value="Sí">Sí</option>
      <option value="No">No</option>
    </select>
    <label for="historia">Historia de tu personaje:</label>
    <textarea id="historia" name="historia" rows="5" required></textarea>
    <input type="submit" value="Enviar solicitud" />
  </form>
</main>
<footer>
  &copy; 2025 Infinity Roleplay
</footer>
<script>
  document.getElementById("whitelistForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const webhookURL =
      "https://discordapp.com/api/webhooks/1403173518111150080/DQI_sBJkxV2AkpOJDCswnj0yhXMflWIZLMpjkIyoY5JQuFMUCULzwn4OlK1-eShmBmCy";
    const payload = {
      embeds: [
        {
          title: "📋 Nueva Solicitud de Whitelist",
          color: 5814783,
          fields: [
            { name: "👤 Discord", value: document.getElementById("discord").value || "—" },
            { name: "🎂 Edad", value: document.getElementById("edad").value || "—" },
            { name: "🎮 Experiencia", value: document.getElementById("experiencia").value || "—" },
            { name: "📖 Qué es Roleplay", value: document.getElementById("rol").value || "—" },
            { name: "✅ Acepta Normas", value: document.getElementById("normas").value || "—" },
            { name: "📝 Historia", value: document.getElementById("historia").value || "—" },
          ],
          timestamp: new Date().toISOString(),
        },
      ],
    };
    fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then((response) => {
        if (response.ok) {
          alert("✅ Solicitud enviada correctamente.");
          document.getElementById("whitelistForm").reset();
        } else {
          response.text().then((t) => {
            alert("❌ Error al enviar la solicitud. Código: " + response.status + "\n" + t);
          });
        }
      })
      .catch((error) => {
        alert("❌ No se pudo conectar al webhook. Verifica la URL y tu conexión.");
        console.error(error);
      });
  });
</script>
</body>
</html>
